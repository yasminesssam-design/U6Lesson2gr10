<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,'Segoe UI',Arial,sans-serif;font-size:22px;line-height:1.8;color:#102a43;background:linear-gradient(135deg,#0b2e5c,#0d4a8a,#16336b,#0b2e5c);background-size:400% 400%;animation:bg 20s ease infinite;min-height:100vh}
@keyframes bg{50%{background-position:100% 50%}}
.fl{position:fixed;top:100%;font:700 34px monospace;color:#f0a01044;pointer-events:none;animation:up linear infinite;z-index:0}
@keyframes up{to{top:-60px;transform:rotate(40deg)}}
.w{position:relative;z-index:1;max-width:1000px;margin:auto;padding:14px}
header{text-align:center;color:#fff}header img{width:150px;background:#fff;border-radius:50%;padding:6px}
h1{margin:6px 0;font-size:38px}h1 small{display:block;font-size:26px;color:#f0a010}
.c{background:#fff;border-radius:18px;padding:18px 22px;margin:16px 0;box-shadow:0 8px 24px #0006}
.c h2{margin:0 0 8px;color:#0d4a8a;font-size:30px;border-bottom:4px solid #f0a010}
.b{border-radius:12px;padding:10px 16px;margin:10px 0}.ar{background:#eef5ff;direction:rtl;border-right:6px solid #0d4a8a}.en{background:#fff7e6;direction:ltr;text-align:left;border-left:6px solid #f0a010}
table{border-collapse:collapse;margin:8px auto;direction:ltr}td,th{border:2px solid #0d4a8a;padding:2px 12px;text-align:center;font-size:21px}th{background:#0d4a8a;color:#fff}
code,.k{background:#0d4a8a;color:#fff;border-radius:8px;padding:0 8px;font-family:monospace;direction:ltr;display:inline-block}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:12px;padding:8px 18px;margin:5px;color:#fff;background:#0d4a8a;transition:.15s}button:hover{transform:scale(1.05)}
.o{background:#f0a010;color:#102a43}.g{background:#1a9c4b}
#nm{font:inherit;padding:8px;border-radius:10px;border:3px solid #f0a010;width:min(100%,380px)}
#qz{position:fixed;inset:0;background:#000b;z-index:9;display:none;overflow:auto}#qz.on{display:block}
#qb{background:#fff;max-width:820px;margin:20px auto;border-radius:20px;padding:20px;font-size:26px;transition:.3s}
.op{display:block;width:100%;text-align:inherit;background:#eef5ff;color:#102a43;border:3px solid #0d4a8a;font-size:25px;margin:8px 0}
.ok{background:#1a9c4b!important;color:#fff!important;animation:pop .5s}.no{background:#d33!important;color:#fff!important;animation:sh .5s}
@keyframes pop{50%{transform:scale(1.08)}}@keyframes sh{25%{transform:translateX(-14px)}75%{transform:translateX(14px)}}
.fx{position:fixed;font-size:60px;z-index:10;pointer-events:none;animation:fy 1.4s forwards}@keyframes fy{to{transform:translateY(-300px) rotate(360deg);opacity:0}}
.bar{height:12px;background:#ddd;border-radius:6px}.bar i{display:block;height:100%;background:#f0a010;border-radius:6px;transition:.3s}
